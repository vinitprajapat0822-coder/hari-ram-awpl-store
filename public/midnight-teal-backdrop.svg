<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="teal" cx="16%" cy="8%" r="78%">
      <stop offset="0" stop-color="#00DCD2" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#00DCD2" stop-opacity=".07"/>
      <stop offset="1" stop-color="#00DCD2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo" cx="92%" cy="22%" r="72%">
      <stop offset="0" stop-color="#2E1A47" stop-opacity=".86"/>
      <stop offset=".55" stop-color="#2E1A47" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2E1A47" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="72%" cy="88%" r="54%">
      <stop offset="0" stop-color="#FFB300" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x2="0" y2="1">
      <stop stop-color="#031A1C"/>
      <stop offset=".56" stop-color="#052326"/>
      <stop offset="1" stop-color="#020A12"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" stitchTiles="stitch" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .10"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#teal)"/>
  <rect width="1600" height="1000" fill="url(#indigo)"/>
  <rect width="1600" height="1000" fill="url(#amber)"/>
  <rect width="1600" height="1000" fill="#fff" opacity=".13" filter="url(#grain)"/>
</svg>
