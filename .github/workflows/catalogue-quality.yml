name: Catalogue quality gates

on:
  push:
    branches:
      - "catalogue/**"
      - "main"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catalogue-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate catalogue audit report
        run: npm run audit:catalogue

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Playwright end-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload catalogue audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-audit-report
          path: docs/catalogue-audit-report.md
          if-no-files-found: warn
          retention-days: 14
