name: Deploy Hari Ram AWPL Store to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify and preserve GitHub Pages .nojekyll marker
        run: |
          test -f ./public/.nojekyll
          cp ./public/.nojekyll ./out/.nojekyll
          test -f ./out/.nojekyll

      - name: Verify exported product detail pages
        run: |
          test -f ./out/index.html
          test -f ./out/login/index.html
          test -f ./out/reset-password/index.html
          test -f ./out/category/home-care/index.html
          test -f ./out/category/agriculture/index.html
          test -f ./out/sitemap.xml
          test -f ./out/robots.txt
          category_count=$(find ./out/category -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "Exported category pages: ${category_count}"
          test "${category_count}" -eq 15
          test -f ./out/product/awpl-elite-salicylic-sheet-mask/index.html
          test -f ./out/product/awpl-sniss-elite-salicylic-acid-face-sheet-mask/index.html
          count=$(find ./out/product -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "Exported product detail pages: ${count}"
          test "${count}" -ge 148

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
